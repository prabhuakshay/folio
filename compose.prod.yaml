# Production stack: gunicorn built from the Dockerfile's prod target, and the
# Postgres it keeps its data in.
#
#   docker compose -f compose.prod.yaml up -d --build
#
# Static files are baked into the image and served by WhiteNoise, so there is
# no Node, no watcher and no static volume. Postgres publishes no port: only web
# reaches it, over the stack's own network, and its data lives in the pgdata
# volume, which is what to back up.
#
# Nothing here terminates TLS. The port is published on loopback only, for the
# host's reverse proxy (Caddy) to forward to. That proxy must set
# X-Forwarded-Proto and X-Forwarded-For and strip any copy a client sent, since
# the app trusts both: every request reaches it through the proxy.
#
# Every other Django setting comes from .env. The values set here are about
# running the stack: the image tag, the published port, resource caps, the
# database and the proxy in front.

name: folio

services:
  web:
    build:
      context: .
      target: prod
    image: ${FOLIO_IMAGE:-folio}:${FOLIO_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://folio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/folio
      USE_X_FORWARDED_PROTO: "True"
      USE_X_FORWARDED_FOR: "True"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

    # Hardening: the code can't be modified at runtime and the process holds no
    # Linux capabilities. The app keeps nothing on disk, not even upload temp
    # files; /tmp is a scratch tmpfs for libraries that insist on one.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Longer than gunicorn's graceful_timeout, so in-flight requests finish
    # before Docker resorts to SIGKILL.
    stop_grace_period: 40s

    # A preloaded master plus two sync workers sits around 200-300 MB. The
    # memory cap is a backstop against leaks (worker recycling in
    # gunicorn.conf.py should reclaim memory first). Raise it with
    # WEB_CONCURRENCY: roughly +100 MB and +1 CPU per extra worker.
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPU_LIMIT:-2.0}"
          memory: ${WEB_MEMORY_LIMIT:-768M}
        reservations:
          memory: ${WEB_MEMORY_RESERVATION:-256M}

    # Docker's default json-file log grows without bound.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    # Pinned to a major version: moving to the next needs a dump and restore,
    # never just a newer image.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: folio
      POSTGRES_DB: folio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18 keeps its data in a versioned directory below this.
      - pgdata:/var/lib/postgresql
    # Keeps its capabilities: the entrypoint starts as root to own the data
    # directory, then drops to the postgres user.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
