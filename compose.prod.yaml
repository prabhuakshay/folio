# Production stack: one gunicorn service built from the Dockerfile's prod target.
#
#   docker compose -f compose.prod.yaml up -d --build
#
# Static files are baked into the image and served by WhiteNoise, so there is
# no Node, no watcher and no static volume. There is no database container
# either: DATABASE_URL must point at a Postgres server (SQLite can't work on the
# read-only filesystem). A server on this host is host.docker.internal.
#
# Nothing here terminates TLS. The port is published on loopback only, for a
# reverse proxy on the host (Caddy, nginx) to forward to. That proxy must set
# X-Forwarded-Proto and strip any copy a client sent, since the app trusts it
# when USE_X_FORWARDED_PROTO=True.
#
# Every Django setting comes from .env. The only values set here are about
# running the container: the image tag, the published port and resource caps,
# all overridable from .env too.

name: folio

services:
  web:
    build:
      context: .
      target: prod
    image: ${FOLIO_IMAGE:-folio}:${FOLIO_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Hardening: the code can't be modified at runtime and the process holds no
    # Linux capabilities. /tmp is for upload temp files; media is the one
    # persistent place the app writes.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - media:/app/media

    # Longer than gunicorn's graceful_timeout, so in-flight requests finish
    # before Docker resorts to SIGKILL.
    stop_grace_period: 40s

    # A preloaded master plus two sync workers sits around 200-300 MB. The
    # memory cap is a backstop against leaks (worker recycling in
    # gunicorn.conf.py should reclaim memory first). Raise it with
    # WEB_CONCURRENCY: roughly +100 MB and +1 CPU per extra worker.
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPU_LIMIT:-2.0}"
          memory: ${WEB_MEMORY_LIMIT:-768M}
        reservations:
          memory: ${WEB_MEMORY_RESERVATION:-256M}

    # Docker's default json-file log grows without bound.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  media:
