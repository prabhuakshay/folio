# Local development stack:
#
#   web          autoreloading runserver with the working tree bind-mounted
#   postgres     the database, as in prod, its data in the pgdata volume
#   cron         supercronic running the scheduled commands in docker/crontab
#   tailwind     Tailwind CLI in watch mode, rebuilding static/css/app.css
#   mountpoints  one-shot ahead of tailwind that keeps root out of your tree
#
#   cp .env.example .env      # then set SECRET_KEY
#   docker compose up --build
#
# Every Django setting comes from .env except DATABASE_URL, which this file
# points at the postgres service so dev runs on the same database as prod.
# `docker compose down -v` drops the volume and starts the database afresh;
# `docker compose exec postgres psql -U folio` opens a shell on it.

name: folio

services:
  web:
    build: &dev-build
      context: .
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgres://folio:${POSTGRES_PASSWORD:-folio}@postgres:5432/folio
    # Run as you: anything the server writes into the tree (migrations) must
    # stay editable without sudo.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py createcachetable
      && python manage.py setup_code
      && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "${WEB_PORT:-8000}:8000"
    # Keeps stdin open so `breakpoint()` works: `docker attach folio-web-1`.
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      # Waits for the stylesheet to exist, not just for the container to start.
      # On a fresh clone the first npm install takes long enough that Django
      # would otherwise serve the first pages unstyled.
      tailwind:
        condition: service_healthy

  cron:
    build: *dev-build
    env_file: .env
    environment:
      DATABASE_URL: postgres://folio:${POSTGRES_PASSWORD:-folio}@postgres:5432/folio
      # As in prod; web runs the migrations.
      RUN_MIGRATIONS: "0"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    command: supercronic /app/docker/crontab
    volumes:
      - .:/app
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # Same major version as compose.prod.yaml; keep the two in step.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: folio
      POSTGRES_DB: folio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-folio}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 2s
      timeout: 3s
      retries: 15

  tailwind:
    build: &tailwind-build
      context: .
      target: tailwind
      args:
        # Must match `user:` below; the stage creates node_modules owned by it.
        DOCKER_UID: ${DOCKER_UID:-1000}
        DOCKER_GID: ${DOCKER_GID:-1000}
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    # Required: without a TTY stdin closes immediately, and the watcher reads
    # that as its parent going away and stops rebuilding while the container
    # still looks alive. `--watch=always` in package.json guards the same thing,
    # and `--poll` guards against filesystem events silently dropping a subtree
    # on long runs.
    tty: true
    volumes:
      - .:/app
      - /app/node_modules
    # `install`, not `ci`: node_modules is a volume that outlives a run, and
    # install skips the work when it is already correct.
    command: sh -c "npm install --no-audit --no-fund && npm run watch"
    depends_on:
      mountpoints:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/static/css/app.css"]
      interval: 2s
      timeout: 3s
      retries: 5
      # Covers the first npm install on a cold cache.
      start_period: 180s
    restart: unless-stopped
    # A watcher over a bind mount can spin when something goes wrong; this caps
    # the damage.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Docker creates a missing mountpoint as root, and tailwind's node_modules
  # mask needs one inside your tree. This makes it first, as you.
  mountpoints:
    build: *tailwind-build
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - .:/app
    command: mkdir -p node_modules

volumes:
  pgdata:
