{% load static %}
<!DOCTYPE html>
<html lang="en-IN">
    <head>
        <meta charset="utf-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="color-scheme" content="light">
        <meta name="theme-color" content="#FFFFFF">
        {# htmx's indicator styles are inline and eval-based features need unsafe-eval; the CSP allows neither. #}
        <meta name="htmx-config"
              content='{"includeIndicatorStyles": false, "allowEval": false}'>
        <title>{% block title %}Folio{% endblock %}</title>
        <link rel="manifest" href="{% url 'manifest' %}">
        <link rel="icon"
              href="{% static 'icons/favicon.svg' %}"
              type="image/svg+xml">
        <link rel="apple-touch-icon"
              href="{% static 'icons/apple-touch-icon.png' %}">
        <link rel="preload"
              href="{% static 'fonts/archivo-latin-wdth-normal.woff2' %}"
              as="font"
              type="font/woff2"
              crossorigin>
        <link rel="stylesheet" href="{% static 'css/app.css' %}">
        <script src="{% static 'vendor/htmx-2.0.11.min.js' %}" defer></script>
        <script src="{% static 'js/app.js' %}" defer></script>
    </head>
    <body class="min-h-dvh bg-white font-sans text-ink antialiased"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
        {% block body %}{% endblock %}
    </body>
</html>
