<p class="font-semibold mb-1">{{ variant }} · {{ variant_name }}</p>
<p class="mb-3 leading-4 text-white/70">{{ rule }}</p>
<dl class="space-y-1.5">
    <div>
        <dt class="text-white/55">Screen</dt>
        <dd>
            {{ screen }}
        </dd>
    </div>
    <div>
        <dt class="text-white/55">Path</dt>
        <dd>
            {{ trail }}
        </dd>
    </div>
    <div>
        <dt class="text-white/55">Back goes to</dt>
        <dd>
            {{ back_to }}
        </dd>
    </div>
    {% if variant == "L" %}
        <div>
            <dt class="text-white/55">Tab</dt>
            <dd>
                {{ tab }}
            </dd>
        </div>
    {% endif %}
</dl>
<div id="proto-last" hidden></div>
