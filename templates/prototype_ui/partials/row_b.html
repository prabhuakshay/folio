<li class="flex items-center gap-3.5 px-4 py-3.5 {% if t.new %}row-new{% endif %}">
    <span class="tile size-11 rounded-full"
          style="--c: {{ t.color }}"><i data-lucide="{{ t.icon }}"
   class="size-5"></i></span>
    <div class="min-w-0 flex-1">
        <p class="truncate text-[15px] font-semibold leading-5">{{ t.payee }}</p>
        <p class="truncate text-[13px] leading-5 text-(--ink-3)">{{ t.time }} · {{ t.paid_from }}</p>
    </div>
    <p class="num text-[15px] font-semibold {% if t.amount.pos %}text-(--pos){% endif %}">{{ t.amount.sign }}<span class="cur">₹</span>{{ t.amount.whole }}{% if t.amount.paise != "00" %}<span class="paise">.{{ t.amount.paise }}</span>{% endif %}</p>
</li>
