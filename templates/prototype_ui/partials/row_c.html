<li class="flex items-center gap-3 py-3 {% if t.new %}row-new{% endif %}">
    <span class="tile size-10 rounded-full"
          style="--c: {{ t.color }}"><i data-lucide="{{ t.icon }}"
   class="size-[18px]"></i></span>
    <div class="min-w-0 flex-1">
        <p class="truncate text-[15px] font-medium leading-5">{{ t.payee }}</p>
        <p class="truncate text-[13px] leading-5 text-(--ink-3)">{{ t.category }} · {{ t.paid_from }}</p>
    </div>
    <p class="num text-[15px] font-semibold {% if t.amount.pos %}text-(--pos){% endif %}">{{ t.amount.sign }}<span class="cur">₹</span>{{ t.amount.whole }}</p>
</li>
