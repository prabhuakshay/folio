<li>
    <a href="{{ url }}" class="flex items-center gap-4 py-4">
        <span class="tile size-10 rounded-full"
              style="--c: #000"><i data-lucide="{{ icon }}"
   class="size-[18px]"></i></span>
        <span class="min-w-0 flex-1">
            <span class="block text-[16px] font-medium">{{ title }}</span>
            <span class="block truncate text-[13px] {% if warn %}font-medium text-(--neg){% elif accent %}text-(--accent){% else %}text-(--ink-2){% endif %}">{{ line }}</span>
        </span>
        <i data-lucide="chevron-right" class="size-5 text-(--ink-3)"></i>
    </a>
</li>
