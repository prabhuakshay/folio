{# Sensitive actions need a fresh passkey or TOTP check, good for ten minutes. #}
{% if sudo %}
    <p class="mt-4 flex items-center gap-2 rounded-[14px] bg-(--well) px-4 py-3 text-[13px] text-(--ink-2)">
        <i data-lucide="lock-open" class="size-4 text-(--pos)"></i>Confirmed it's you · changes allowed for 10 minutes
    </p>
{% else %}
    <a href="{{ sudo_url }}"
       class="mt-4 flex items-center gap-3 rounded-[20px] bg-(--ink) px-5 py-4 text-white">
        <i data-lucide="fingerprint" class="size-5"></i>
        <span class="min-w-0 flex-1"><span class="block text-[15px] font-medium">Confirm it's you</span><span class="block text-[13px] text-white/70">{{ sudo_why }}</span></span>
    </a>
{% endif %}
