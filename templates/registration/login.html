{% extends "base.html" %}
{% block title %}
    Sign in · Folio
{% endblock %}
{% block body %}
    <main class="mx-auto flex min-h-dvh max-w-sm flex-col justify-center px-6 py-12">
        <p class="wordmark text-[22px]">FOLIO</p>
        <h1 class="display mt-10 text-[40px] leading-none">Sign in</h1>
        <form method="post" class="mt-8 space-y-3">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% if form.errors %}
                <p class="text-[14px] font-medium text-negative">That username and password don't match.</p>
            {% endif %}
            <label class="block">
                <span class="text-[13px] font-medium text-ink-2">Username</span>
                <input class="field mt-1"
                       type="text"
                       name="username"
                       value="{{ form.username.value|default:'' }}"
                       autocomplete="username"
                       autocapitalize="none"
                       required
                       autofocus>
            </label>
            <label class="block">
                <span class="text-[13px] font-medium text-ink-2">Password</span>
                <input class="field mt-1"
                       type="password"
                       name="password"
                       autocomplete="current-password"
                       required>
            </label>
            <button type="submit"
                    class="mt-4 h-12 w-full rounded-full bg-ink text-[15px] font-semibold text-white">Sign in</button>
        </form>
    </main>
{% endblock %}
