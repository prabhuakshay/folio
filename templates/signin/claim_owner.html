{% extends "signin/page.html" %}
{% block title %}
    Claim · Folio
{% endblock %}
{% block main %}
    <h1 class="display mt-10 text-[52px] leading-[.92]">Make it yours</h1>
    <p class="mt-4 text-[16px] leading-6 text-ink-2">The only login this Folio will ever have.</p>
    <form method="post" class="mt-8 space-y-3">
        {% csrf_token %}
        <label class="block">
            <span class="text-[13px] font-medium text-ink-2">Name</span>
            <input class="field mt-1"
                   name="name"
                   value="{{ form.name.value|default:'' }}"
                   autocomplete="name"
                   required
                   autofocus>
            {% include "signin/field_errors.html" with field=form.name %}
        </label>
        <label class="block">
            <span class="text-[13px] font-medium text-ink-2">Email</span>
            <input class="field mt-1"
                   type="email"
                   name="email"
                   value="{{ form.email.value|default:'' }}"
                   autocomplete="email"
                   required>
            {% include "signin/field_errors.html" with field=form.email %}
        </label>
        <label class="block">
            <span class="text-[13px] font-medium text-ink-2">Password</span>
            <input class="field mt-1"
                   type="password"
                   name="password"
                   autocomplete="new-password"
                   required>
            {% include "signin/field_errors.html" with field=form.password %}
        </label>
        <p class="pt-1 text-[13px] text-ink-3">You sign in with this email.</p>
        {% include "signin/submit.html" with label="Create my login" %}
    </form>
{% endblock %}
