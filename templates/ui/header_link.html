{% url key as href %}
<a href="{{ href }}"
   data-tab-link
   class="relative {% if tab == key %}text-ink{% else %}text-ink-3{% endif %}"
   {% if tab == key %}aria-current="page"{% endif %}>
    {{ label }}
    {% if tab == key %}
        <span class="absolute -bottom-2 left-1/2 size-1 -translate-x-1/2 rounded-full bg-cobalt"></span>
    {% endif %}
</a>
