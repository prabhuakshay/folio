{% extends "ui/screen.html" %}
{% block content %}
    <p class="mt-3 text-[16px] text-ink-2">Profile, rules, books and security will show here.</p>
    <form method="post" action="{% url 'logout' %}" class="mt-10 border-t pt-6">
        {% csrf_token %}
        <button type="submit" class="text-[15px] font-medium text-negative">Sign out</button>
    </form>
{% endblock %}
